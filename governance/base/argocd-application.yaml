apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhacm-policy-generator
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'git@github.com:ebeaudoi/acm-notes.git'
    targetRevision: HEAD
    path: governance/base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: global-policies
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
